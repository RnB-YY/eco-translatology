<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>健康老龄化论文｜封面方案</title>
  <style>
    :root { color-scheme: light; --ink:#16231d; --muted:#65736c; --paper:#f4f5f0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Noto Sans KR",sans-serif; }
    header { padding:28px 18px 16px; max-width:1100px; margin:auto; }
    h1 { margin:0 0 8px; font-size:clamp(24px,6vw,42px); line-height:1.15; }
    p { margin:0; color:var(--muted); font-size:15px; }
    main { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; max-width:1100px; margin:auto; padding:12px 14px 36px; }
    figure { margin:0; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 5px 20px rgba(22,35,29,.08); }
    a { display:block; color:inherit; text-decoration:none; }
    img { display:block; width:100%; height:auto; background:#ddd; }
    figcaption { padding:10px 12px 12px; font-size:15px; font-weight:700; }
    @media (max-width:720px) { main { grid-template-columns:1fr; gap:18px; } header { padding-top:22px; } figure { border-radius:10px; } }
  </style>
</head>
<body>
  <header>
    <h1>封面风格预览</h1>
    <p>点击任意图片，可在手机上打开原图并放大查看。</p>
  </header>
  <main>
    <figure><a href="cover-01.png"><img src="cover-01.png" alt="封面方案 1"></a><figcaption>01｜学术编辑风</figcaption></figure>
    <figure><a href="cover-02.png"><img src="cover-02.png" alt="封面方案 2"></a><figcaption>02｜深蓝学术风</figcaption></figure>
    <figure><a href="cover-03.png"><img src="cover-03.png" alt="封面方案 3"></a><figcaption>03｜深绿生态研究风</figcaption></figure>
    <figure><a href="cover-04.png"><img src="cover-04.png" alt="封面方案 4"></a><figcaption>04｜研究数据网格风</figcaption></figure>
    <figure><a href="cover-05.png"><img src="cover-05.png" alt="封面方案 5"></a><figcaption>05｜黑白杂志分栏风</figcaption></figure>
    <figure><a href="cover-06.png"><img src="cover-06.png" alt="封面方案 6"></a><figcaption>06｜柔和生态风</figcaption></figure>
  </main>
</body>
</html>
